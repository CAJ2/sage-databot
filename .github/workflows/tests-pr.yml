name: Integration Tests (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: integration-tests-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WMILL_BASE_URL: https://databot.dev.sageleaf.app
  WMILL_WORKSPACE: sage-dev

jobs:
  test:
    name: 'Run tests'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install wmill CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/windmill-labs/windmill/main/cli/install.sh | bash
          wmill version

      - name: Set workspace ID
        id: ws
        run: echo "id=wm-fork-test-pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Fork workspace (create if not exists)
        run: |
          WS_ID="${{ steps.ws.outputs.id }}"
          EXISTS=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.WMILL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"id\": \"$WS_ID\"}" \
            "${{ env.WMILL_BASE_URL }}/api/workspaces/exists")
          if [ "$EXISTS" = "true" ]; then
            echo "Workspace $WS_ID already exists, reusing it"
          else
            curl -s -f -X POST \
              -H "Authorization: Bearer ${{ secrets.WMILL_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"id\": \"$WS_ID\", \"name\": \"$WS_ID\"}" \
              "${{ env.WMILL_BASE_URL }}/api/w/${{ env.WMILL_WORKSPACE }}/workspaces/create_fork"
            echo "Created forked workspace: $WS_ID"
          fi

      - name: Sync push to forked workspace
        run: |
          wmill sync push \
            --workspace ${{ steps.ws.outputs.id }} \
            --base-url ${{ env.WMILL_BASE_URL }} \
            --token ${{ secrets.WMILL_TOKEN }} \
            --branch dev

      - name: Run integration tests
        id: tests
        run: |
          WS_ID="${{ steps.ws.outputs.id }}"
          JOB_ID=$(wmill flow run f/test/run_tests \
            --workspace "$WS_ID" \
            --base-url ${{ env.WMILL_BASE_URL }} \
            --token ${{ secrets.WMILL_TOKEN }} 2>&1 | grep -Eo '[a-f0-9-]{36}')

          if [ -z "$JOB_ID" ]; then
            echo "Error: Failed to extract job ID from wmill output"
            exit 1
          fi

          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

          # Poll for completion (max 10 minutes)
          for i in $(seq 1 60); do
            sleep 10
            STATUS=$(curl -s -H "Authorization: Bearer ${{ secrets.WMILL_TOKEN }}" \
              "${{ env.WMILL_BASE_URL }}/api/w/$WS_ID/jobs_u/get/$JOB_ID" \
              | jq -r '.type // "unknown"')

            if [ "$STATUS" = "CompletedJob" ]; then
              echo "Tests completed"
              break
            elif [ "$STATUS" = "unknown" ]; then
              echo "Waiting for job to start... (attempt $i)"
            else
              echo "Job status: $STATUS (attempt $i)"
            fi

            if [ $i -eq 60 ]; then
              echo "Timeout waiting for test results"
              exit 1
            fi
          done

      - name: Fetch test results
        id: results
        run: |
          RESULT=$(curl -s -H "Authorization: Bearer ${{ secrets.WMILL_TOKEN }}" \
            "${{ env.WMILL_BASE_URL }}/api/w/${{ steps.ws.outputs.id }}/jobs_u/get/${{ steps.tests.outputs.job_id }}" \
            | jq -r '.result')

          MARKDOWN=$(echo "$RESULT" | jq -r '.markdown // "No results available"')
          SUCCESS=$(echo "$RESULT" | jq -r '.success // false')

          echo "$MARKDOWN" > test-results.md
          echo "success=$SUCCESS" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: integration-tests
          path: test-results.md

      - name: Check test status
        if: steps.results.outputs.success != 'true'
        run: |
          echo "Integration tests failed"
          exit 1
