name: Integration Tests (Dev)

on:
  push:
    branches: [dev]

concurrency:
  group: integration-tests-dev

env:
  WMILL_BASE_URL: https://databot.dev.sageleaf.app
  WMILL_WORKSPACE: sage-dev
  TEST_WS_ID: wm-fork-test-dev
  HEADERS: ${{ secrets.WMILL_HEADERS }}

jobs:
  test:
    name: 'Run tests'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=20'

      - name: Install wmill CLI
        run: |
          npm install -g windmill-cli
          wmill --version

      - name: Fork workspace (create if not exists)
        run: |
          wmill workspace add ${{ env.WMILL_WORKSPACE }} ${{ env.WMILL_WORKSPACE }} \
            ${{ env.WMILL_BASE_URL }} --token ${{ secrets.WMILL_TOKEN }}
          wmill workspace fork test-dev ${{ env.TEST_WS_ID }} \
            --workspace ${{ env.WMILL_WORKSPACE }} \
            --base-url ${{ env.WMILL_BASE_URL }} \
            --token ${{ secrets.WMILL_TOKEN }}
        continue-on-error: true

      - name: Sync push to forked workspace
        run: |
          wmill sync push \
            --workspace ${{ env.TEST_WS_ID }} \
            --base-url ${{ env.WMILL_BASE_URL }} \
            --token ${{ secrets.WMILL_TOKEN }} \
            --branch dev --yes --locks-required

      - name: Trigger integration tests
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.WMILL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "head_sha": "${{ github.sha }}",
              "repo": "${{ github.repository }}",
              "ref": "${{ github.ref_name }}"
            }' \
            "${{ env.WMILL_BASE_URL }}/api/w/${{ env.TEST_WS_ID }}/jobs/run/f/f/test/run_tests"
          echo "Integration tests triggered in workspace ${{ env.TEST_WS_ID }}"
