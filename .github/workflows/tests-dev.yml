name: Integration Tests (Dev)

on:
  push:
    branches: [dev]

concurrency:
  group: tests-dev

env:
  WMILL_BASE_URL: https://databot.dev.sageleaf.app
  WMILL_WORKSPACE: sage-dev
  TEST_WS_ID: wm-fork-test-dev
  HEADERS: ${{ secrets.WMILL_HEADERS }}

jobs:
  test:
    name: 'Run tests'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=20'

      - name: Install wmill CLI
        run: |
          npm install -g windmill-cli
          wmill --version

      - name: Fork workspace (delete if exists, then create)
        run: |
          EXISTS=$(curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.WMILL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"id\": \"${{ env.TEST_WS_ID }}\"}" \
            "${{ env.WMILL_BASE_URL }}/api/workspaces/exists")
          if [ "$EXISTS" = "true" ]; then
            curl -sf -X DELETE \
              -H "Authorization: Bearer ${{ secrets.WMILL_TOKEN }}" \
              "${{ env.WMILL_BASE_URL }}/api/workspaces/${{ env.TEST_WS_ID }}"
            echo "Deleted existing workspace: ${{ env.TEST_WS_ID }}"
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.WMILL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"id\": \"${{ env.TEST_WS_ID }}\", \"name\": \"${{ env.TEST_WS_ID }}\"}" \
            "${{ env.WMILL_BASE_URL }}/api/w/${{ env.WMILL_WORKSPACE }}/workspaces/create_fork"
          echo "Created forked workspace: ${{ env.TEST_WS_ID }}"

      - name: Sync push to forked workspace
        run: |
          wmill sync push \
            --workspace ${{ env.TEST_WS_ID }} \
            --base-url ${{ env.WMILL_BASE_URL }} \
            --token ${{ secrets.WMILL_TOKEN }} \
            --branch dev --yes --locks-required

      - name: Trigger integration tests
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.WMILL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "head_sha": "${{ github.sha }}",
              "repo": "${{ github.repository }}",
              "ref": "${{ github.ref_name }}"
            }' \
            "${{ env.WMILL_BASE_URL }}/api/w/${{ env.TEST_WS_ID }}/jobs/run/f/f/test/run_tests"
          echo "Integration tests triggered in workspace ${{ env.TEST_WS_ID }}"
