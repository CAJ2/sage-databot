name: Sync Project (Dev)

on:
  push:
    branches: [dev]

concurrency:
  group: sync-dev

env:
  WMILL_BASE_URL: https://databot.dev.sageleaf.app
  WMILL_WORKSPACE: sage-dev
  HEADERS: ${{ secrets.WMILL_HEADERS }}

jobs:
  sync:
    name: 'Sync dev to Windmill'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=20'

      - name: Install wmill CLI
        run: |
          npm install -g windmill-cli
          wmill --version

      - name: Sync push to workspace
        run: |
          wmill sync push \
            --workspace ${{ env.WMILL_WORKSPACE }} \
            --base-url ${{ env.WMILL_BASE_URL }} \
            --token ${{ secrets.WMILL_TOKEN }} \
            --branch dev --yes --locks-required
