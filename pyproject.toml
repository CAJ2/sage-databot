[project]
name = "sage-databot"
version = "0.1.0"
description = "Collects and parses information for the Sage database"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy>=2.0.45",
  "sqlalchemy-cockroachdb>=2.0.3",
  "psycopg[binary]>=3.3.2",
  "python-dotenv>=1.2.1",
  "ruff>=0.14.10",
  "gitpython>=3.1.44",
  "duckdb>=1.4.3",
  "polars>=1.36.1",
  "marimo>=0.18.4",
  "pyarrow>=22.0.0",
  "adbc-driver-sqlite>=1.9.0",
  "adbc-driver-postgresql>=1.9.0",
  "connectorx>=0.4.4",
  "python-iso639>=2025.11.16",
  "pandas>=2.3.3",
  "osmium>=4.2.0",
  "nanoid>=2.0.0",
  "jsonschema>=4.25.1",
  "networkx[default]>=3.6.1",
  "ariadne-codegen>=0.17.0",
  "stopwordsiso>=0.6.1",
  "jinja2>=3.1.6",
  "fasttext>=0.9.3",
  "fastexcel>=0.18.0",
  "pydantic-ai>=1.67.0",
  "pydantic>=2.12.5",
  "smart-open[s3,http]>=7.1.0",
  "wmill>=1.669.1",
  "logfire>=4.27.0",
  "openrouter>=0.8.0",
  "typesense>=2.0.0",
  "nltk>=3.9.2",
  "mistralai>=1.9.11",
]

[project.optional-dependencies]
all = ["sage-databot[extract]"]
extract = ["unstructured[all-docs]>=0.21.5", "scrapy>=2.14.0", "spacy>=3.8.11"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
sage-databot = { path = ".", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/sage_databot"]

[tool.hatch.build.targets.wheel.force-include]
"src/tags" = "sage_databot/tags"

[tool.pixi.tasks]
deps = "python src/pyproject_deps.py"
graphql = "python src/graphql_gen.py"
nanoids = "python src/scripts/gen_ids.py"
check = "ruff check --fix && ruff format && npx oxfmt && basedpyright"
local-up = "python src/local_windmill.py"
local-stop = "python src/local_windmill.py --stop"
local-status = "python src/local_windmill.py --status"
dev-sync = "python src/dev_sync.py"
dev-run = "python src/dev_sync.py --run"

[tool.pixi.dependencies]
prek = ">=0.3.4,<0.4"
basedpyright = ">=1.38.2,<2"
ruff = ">=0.15.2,<0.16"

[tool.pixi.environments]
default = { features = ["all"], solve-group = "default" }

[tool.ariadne-codegen]
schema_path = "f/graphql/schema.gql"
queries_path = "f/graphql/queries"
target_package_name = "api_client"
target_package_path = "f/graphql"
async_client = false
