description: Meilisearch API
format_extension: null
is_fileset: false
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  order:
    - api_url
    - api_key
  properties:
    api_key:
      type: string
      description: Key obtained from the Meilisearch deployment
      default: ''
      password: true
    api_url:
      type: string
      description: URL of the Meilisearch API
      default: ''
      nullable: false
  required:
    - api_key
    - api_url
