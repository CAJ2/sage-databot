summary: Automated AI review of a proposed Change
description: >
  Triggered with a change_id. Fetches the Change and all its Edits from the
  GraphQL API. For each edit, calls the model-specific context script
  (mode="review") to get rich structured context, then runs the generic
  review_edit script to produce an EditAnalysis. Collects all analyses and
  writes results to the Change record in CRDB using SQLAlchemy ORM. Status is
  set to APPROVED if all edits pass, REJECTED if any fail. Raises an error if
  the Change has no edits.
value:
  modules:
    - id: a
      value:
        lock: '!inline fetch_change_edits.inline_script.lock'
        type: rawscript
        content: '!inline fetch_change_edits.inline_script.py'
        language: python3
        input_transforms:
          change_id:
            expr: flow_input.change_id
            type: javascript
        concurrency_time_window_s: 0
      summary: Fetch change edits
      continue_on_error: false
    - id: b
      value:
        type: forloopflow
        squash: false
        modules:
          - id: c
            value:
              type: branchone
              default:
                - id: c_generic
                  value:
                    path: f/context/generic_context
                    type: script
                    is_trigger: false
                    input_transforms:
                      mode:
                        expr: '"review"'
                        type: javascript
                      entity_id:
                        expr: flow_input.iter.value.entity_id
                        type: javascript
                  summary: Fetch generic context
                  continue_on_error: true
              branches:
                - expr: flow_input.iter.value.entity_name == "Variant"
                  modules:
                    - id: c_variant
                      value:
                        path: f/context/variant_context
                        type: script
                        is_trigger: false
                        input_transforms:
                          mode:
                            expr: '"review"'
                            type: javascript
                          entity_id:
                            expr: flow_input.iter.value.entity_id
                            type: javascript
                      summary: Fetch Variant context
                      continue_on_error: true
                  summary: Variant
                  parallel: true
                  skip_failure: false
                - expr: flow_input.iter.value.entity_name == "Item"
                  modules:
                    - id: c_item
                      value:
                        path: f/context/item_context
                        type: script
                        is_trigger: false
                        input_transforms:
                          mode:
                            expr: '"review"'
                            type: javascript
                          entity_id:
                            expr: flow_input.iter.value.entity_id
                            type: javascript
                      summary: Fetch Item context
                      continue_on_error: true
                  summary: Item
                  parallel: true
                  skip_failure: false
                - expr: flow_input.iter.value.entity_name == "Process"
                  modules:
                    - id: c_process
                      value:
                        path: f/context/process_context
                        type: script
                        is_trigger: false
                        input_transforms:
                          mode:
                            expr: '"review"'
                            type: javascript
                          entity_id:
                            expr: flow_input.iter.value.entity_id
                            type: javascript
                      summary: Fetch Process context
                      continue_on_error: true
                  summary: Process
                  parallel: true
                  skip_failure: false
                - expr: flow_input.iter.value.entity_name == "Component"
                  modules:
                    - id: c_component
                      value:
                        path: f/context/component_context
                        type: script
                        is_trigger: false
                        input_transforms:
                          mode:
                            expr: '"review"'
                            type: javascript
                          entity_id:
                            expr: flow_input.iter.value.entity_id
                            type: javascript
                      summary: Fetch Component context
                      continue_on_error: true
                  summary: Component
                  parallel: true
                  skip_failure: false
                - expr: flow_input.iter.value.entity_name == "Place"
                  modules:
                    - id: c_place
                      value:
                        path: f/context/place_context
                        type: script
                        is_trigger: false
                        input_transforms:
                          mode:
                            expr: '"review"'
                            type: javascript
                          entity_id:
                            expr: flow_input.iter.value.entity_id
                            type: javascript
                      summary: Fetch Place context
                      continue_on_error: true
                  summary: Place
                  parallel: true
                  skip_failure: false
                - expr: flow_input.iter.value.entity_name == "Category"
                  modules:
                    - id: c_category
                      value:
                        path: f/context/category_context
                        type: script
                        is_trigger: false
                        input_transforms:
                          mode:
                            expr: '"review"'
                            type: javascript
                          entity_id:
                            expr: flow_input.iter.value.entity_id
                            type: javascript
                      summary: Fetch Category context
                      continue_on_error: true
                  summary: Category
                  parallel: true
                  skip_failure: false
                - expr: flow_input.iter.value.entity_name == "Material"
                  modules:
                    - id: c_material
                      value:
                        path: f/review/material_review
                        type: script
                        is_trigger: false
                        input_transforms:
                          edit_id:
                            expr: flow_input.iter.value.edit_id
                            type: javascript
                          entity_id:
                            expr: flow_input.iter.value.entity_id
                            type: javascript
                          create_changes:
                            expr: flow_input.iter.value.create_changes
                            type: javascript
                          update_changes:
                            expr: flow_input.iter.value.update_changes
                            type: javascript
                      summary: Material tree verification
                      continue_on_error: true
                  summary: Material
                  parallel: true
                  skip_failure: false
            summary: Fetch entity context
          - id: d
            value:
              path: f/changes/review_edit
              type: script
              is_trigger: false
              input_transforms:
                edit_id:
                  expr: flow_input.iter.value.edit_id
                  type: javascript
                create_changes:
                  expr: flow_input.iter.value.create_changes
                  type: javascript
                entity_context:
                  expr: results.c
                  type: javascript
                update_changes:
                  expr: flow_input.iter.value.update_changes
                  type: javascript
            summary: AI review of edit
            continue_on_error: true
        iterator:
          expr: results.a
          type: javascript
        parallel: true
        skip_failures: false
      summary: Analyze each edit
    - id: k
      value:
        lock: '!inline write_review_results_to_crdb.inline_script.lock'
        type: rawscript
        content: '!inline write_review_results_to_crdb.inline_script.py'
        language: python3
        input_transforms:
          change_id:
            expr: flow_input.change_id
            type: javascript
          edit_analyses:
            expr: results.b
            type: javascript
        concurrency_time_window_s: 0
      summary: Write review results to CRDB
      continue_on_error: false
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - change_id
  properties:
    change_id:
      type: string
      description: The ID of the Change to review
  required:
    - change_id
