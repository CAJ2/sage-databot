summary: Automated AI review of a proposed Change
description: >
  Triggered with a change_id. Fetches the Change and all its Edits from the
  GraphQL API. For each edit, calls the model-specific context script
  (mode="review") to get rich structured context, then runs the generic
  review_edit script to produce an EditAnalysis. Collects all analyses and
  writes results to the Change record in CRDB using SQLAlchemy ORM. Status is
  set to APPROVED if all edits pass, REJECTED if any fail. Raises an error if
  the Change has no edits.
value:
  modules:
    - id: a
      summary: Fetch change edits
      value:
        type: rawscript
        content: '!inline fetch_change_edits.inline_script.py'
        input_transforms:
          change_id:
            type: javascript
            expr: flow_input.change_id
        lock: '!inline fetch_change_edits.inline_script.lock'
        concurrency_time_window_s: 0
        language: python3
      continue_on_error: false
    - id: b
      summary: Analyze each edit
      value:
        type: forloopflow
        modules:
          - id: c
            summary: Fetch entity context
            value:
              type: branchone
              branches:
                - summary: Variant
                  modules:
                    - id: c_variant
                      summary: Fetch Variant context
                      value:
                        type: script
                        input_transforms:
                          entity_id:
                            type: javascript
                            expr: flow_input.iter.value.entity_id
                          mode:
                            type: javascript
                            expr: '"review"'
                        is_trigger: false
                        path: f/context/variant_context
                      continue_on_error: true
                  expr: flow_input.iter.value.entity_name == "Variant"
                  parallel: true
                  skip_failure: false
                - summary: Item
                  modules:
                    - id: c_item
                      summary: Fetch Item context
                      value:
                        type: script
                        input_transforms:
                          entity_id:
                            type: javascript
                            expr: flow_input.iter.value.entity_id
                          mode:
                            type: javascript
                            expr: '"review"'
                        is_trigger: false
                        path: f/context/item_context
                      continue_on_error: true
                  expr: flow_input.iter.value.entity_name == "Item"
                  parallel: true
                  skip_failure: false
                - summary: Process
                  modules:
                    - id: c_process
                      summary: Fetch Process context
                      value:
                        type: script
                        input_transforms:
                          entity_id:
                            type: javascript
                            expr: flow_input.iter.value.entity_id
                          mode:
                            type: javascript
                            expr: '"review"'
                        is_trigger: false
                        path: f/context/process_context
                      continue_on_error: true
                  expr: flow_input.iter.value.entity_name == "Process"
                  parallel: true
                  skip_failure: false
                - summary: Component
                  modules:
                    - id: c_component
                      summary: Fetch Component context
                      value:
                        type: script
                        input_transforms:
                          entity_id:
                            type: javascript
                            expr: flow_input.iter.value.entity_id
                          mode:
                            type: javascript
                            expr: '"review"'
                        is_trigger: false
                        path: f/context/component_context
                      continue_on_error: true
                  expr: flow_input.iter.value.entity_name == "Component"
                  parallel: true
                  skip_failure: false
                - summary: Place
                  modules:
                    - id: c_place
                      summary: Fetch Place context
                      value:
                        type: script
                        input_transforms:
                          entity_id:
                            type: javascript
                            expr: flow_input.iter.value.entity_id
                          mode:
                            type: javascript
                            expr: '"review"'
                        is_trigger: false
                        path: f/context/place_context
                      continue_on_error: true
                  expr: flow_input.iter.value.entity_name == "Place"
                  parallel: true
                  skip_failure: false
                - summary: Category
                  modules:
                    - id: c_category
                      summary: Fetch Category context
                      value:
                        type: script
                        input_transforms:
                          entity_id:
                            type: javascript
                            expr: flow_input.iter.value.entity_id
                          mode:
                            type: javascript
                            expr: '"review"'
                        is_trigger: false
                        path: f/context/category_context
                      continue_on_error: true
                  expr: flow_input.iter.value.entity_name == "Category"
                  parallel: true
                  skip_failure: false
                - summary: Material
                  modules:
                    - id: c_material
                      summary: Material tree verification
                      value:
                        type: script
                        input_transforms:
                          create_changes:
                            type: javascript
                            expr: flow_input.iter.value.create_changes
                          edit_id:
                            type: javascript
                            expr: flow_input.iter.value.edit_id
                          entity_id:
                            type: javascript
                            expr: flow_input.iter.value.entity_id
                          update_changes:
                            type: javascript
                            expr: flow_input.iter.value.update_changes
                        is_trigger: false
                        path: f/review/material_review
                      continue_on_error: true
                  expr: flow_input.iter.value.entity_name == "Material"
                  parallel: true
                  skip_failure: false
              default:
                - id: c_generic
                  summary: Fetch generic context
                  value:
                    type: script
                    input_transforms:
                      entity_id:
                        type: javascript
                        expr: flow_input.iter.value.entity_id
                      mode:
                        type: javascript
                        expr: '"review"'
                    is_trigger: false
                    path: f/context/generic_context
                  continue_on_error: true
          - id: d
            summary: AI review of edit
            value:
              type: script
              input_transforms:
                create_changes:
                  type: javascript
                  expr: flow_input.iter.value.create_changes
                edit_id:
                  type: javascript
                  expr: flow_input.iter.value.edit_id
                entity_context:
                  type: javascript
                  expr: results.c
                update_changes:
                  type: javascript
                  expr: flow_input.iter.value.update_changes
              is_trigger: false
              path: f/changes/review_edit
            continue_on_error: true
        iterator:
          type: javascript
          expr: results.a
        parallel: true
        skip_failures: false
        squash: false
    - id: k
      summary: Write review results to CRDB
      value:
        type: rawscript
        content: '!inline write_review_results_to_crdb.inline_script.py'
        input_transforms:
          change_id:
            type: javascript
            expr: flow_input.change_id
          edit_analyses:
            type: javascript
            expr: results.b
        lock: '!inline write_review_results_to_crdb.inline_script.lock'
        concurrency_time_window_s: 0
        language: python3
      continue_on_error: false
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - change_id
  properties:
    change_id:
      type: string
      description: The ID of the Change to review
  required:
    - change_id
