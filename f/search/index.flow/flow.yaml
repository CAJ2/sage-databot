summary: Index changes from CRDB into Typesense
description: ''
value:
  modules:
    - id: a
      summary: Parses incoming triggers
      value:
        type: rawscript
        content: '!inline parses_incoming_triggers.inline_script.py'
        input_transforms:
          length:
            type: javascript
            expr: flow_input.length
          payload:
            type: javascript
            expr: flow_input.payload
        lock: '!inline parses_incoming_triggers.inline_script.lock'
        concurrency_time_window_s: 0
        language: python3
      continue_on_error: false
    - id: b
      summary: Index dispatch
      value:
        type: rawscript
        content: '!inline index_dispatch.inline_script.py'
        input_transforms:
          changes:
            type: javascript
            expr: results.a
          collection_suffix:
            type: javascript
            expr: flow_input.collection_suffix
        lock: '!inline index_dispatch.inline_script.lock'
        language: python3
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - payload
    - length
    - collection_suffix
  properties:
    collection_suffix:
      type: string
      description: Optional suffix for physical reindex collections
      default: ''
    length:
      type: integer
      description: ''
    payload:
      type: array
      description: ''
      default: []
      items:
        type: string
  required: []
