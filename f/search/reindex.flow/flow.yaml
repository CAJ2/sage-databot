summary: Full table reindex into Typesense
description: Paginates through a table using cursor-based batching and calls
  index.flow per batch. Builds versioned physical collections without flipping
  aliases so the new suffix can be promoted manually later.
value:
  modules:
    - id: loop
      value:
        type: whileloopflow
        modules:
          - id: fetch_batch
            summary: Fetch next batch of IDs
            value:
              type: rawscript
              content: '!inline fetch_next_batch_of_ids.inline_script.py'
              input_transforms:
                batch_size:
                  type: javascript
                  expr: flow_input.batch_size
                start_cursor:
                  type: javascript
                  expr: flow_input.start_cursor
                table:
                  type: javascript
                  expr: flow_input.table
              lock: '!inline fetch_next_batch_of_ids.inline_script.lock'
              language: python3
            stop_after_if:
              error_message: null
              expr: results.fetch_batch.count == 0
              skip_if_stopped: true
          - id: call_index
            summary: Call index.flow with batch
            value:
              type: flow
              input_transforms:
                collection_suffix:
                  type: javascript
                  expr: flow_input.collection_suffix
                length:
                  type: javascript
                  expr: results.fetch_batch.count
                payload:
                  type: javascript
                  expr: 'results.fetch_batch.ids.map(id => ({topic: flow_input.table, id}))'
              path: f/search/index
            sleep:
              type: javascript
              expr: flow_input.sleep_seconds
        skip_failures: false
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - table
    - collection_suffix
    - batch_size
    - sleep_seconds
    - start_cursor
  properties:
    batch_size:
      type: integer
      description: Number of rows per batch
      default: 100
    collection_suffix:
      type: string
      description: Suffix for the new physical collections
    sleep_seconds:
      type: integer
      description: Seconds to sleep between batches
      default: 30
    start_cursor:
      type: string
      description: Resume from this ID (exclusive). Leave empty to start from the beginning.
      default: ''
    table:
      type: string
      description: Table name to reindex (e.g. items, variants, categories)
  required:
    - table
    - collection_suffix
