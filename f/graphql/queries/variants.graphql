query GetVariantForReview($id: ID!) {
  variant(id: $id) {
    id
    name
    desc
    items(first: 10) {
      nodes {
        id
        name
        desc
      }
    }
    components(first: 10) {
      nodes {
        component {
          id
          name
        }
        quantity
        unit
      }
    }
    orgs(first: 5) {
      nodes {
        org {
          id
          name
        }
        role
      }
    }
    sources(first: 10) {
      nodes {
        source {
          id
          content
        }
      }
    }
  }
}

query GetVariant($first: Int, $after: String) {
  variants(first: $first, after: $after) {
    edges {
      node {
        id
        name
        desc
        createdAt
        updatedAt
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

mutation AddVariant($input: CreateVariantInput!) {
  createVariant(input: $input) {
    variant {
      id
      name
      desc
      createdAt
      updatedAt
    }
    change {
      id
    }
  }
}

mutation UpdateVariant($input: UpdateVariantInput!) {
  updateVariant(input: $input) {
    variant {
      id
      name
      desc
      createdAt
      updatedAt
    }
    change {
      id
    }
  }
}
