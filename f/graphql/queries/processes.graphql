query GetProcessForReview($id: ID!) {
  process(id: $id) {
    id
    name
    desc
    intent
    material {
      id
      name
    }
    org {
      id
      name
    }
    place {
      id
      name
    }
    region {
      id
    }
    variant {
      id
      name
    }
    efficiency {
      efficiency
      equivalency
      valueRatio
    }
    sources(first: 10) {
      nodes {
        source {
          id
          content
        }
      }
    }
  }
}
