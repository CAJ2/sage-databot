query GetRootCategory {
  categoryRoot {
    id
  }
}

query GetCategoryForReview($id: ID!) {
  category(id: $id) {
    id
    name
    desc
    parents(first: 5) {
      nodes {
        id
        name
      }
    }
    children(first: 10) {
      nodes {
        id
        name
      }
    }
    items(first: 10) {
      nodes {
        id
        name
      }
    }
  }
}
