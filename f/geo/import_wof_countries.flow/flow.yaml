summary: Import WOF Countries
description: Import Whos On First global countries data from Geocode Earth
  (legacy GeoJSON format)
value:
  modules:
    - id: a
      summary: Load WOF countries data
      value:
        type: rawscript
        content: '!inline load_wof_countries_data.inline_script.py'
        input_transforms: {}
        lock: '!inline load_wof_countries_data.inline_script.lock'
        concurrency_time_window_s: 0
        language: python3
      continue_on_error: false
    - id: b
      summary: Transform and insert
      value:
        type: rawscript
        content: '!inline transform_and_insert.inline_script.py'
        input_transforms:
          s3_file:
            type: javascript
            expr: results.a
        lock: '!inline transform_and_insert.inline_script.lock'
        concurrency_time_window_s: 0
        language: python3
      continue_on_error: false
      timeout:
        type: static
        value: 3600
  flow_env: {}
