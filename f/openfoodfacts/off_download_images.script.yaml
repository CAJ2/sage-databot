summary: Download OpenFoodFacts product images and upload to S3
description: |
  Downloads product images from OpenFoodFacts S3 bucket for a given variant,
  uploads them to the sage-leaf-sources S3 bucket, and creates source records
  via the GraphQL API.
lock: '!inline f/openfoodfacts/off_download_images.script.lock'
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  properties:
    image_sizes:
      type: array
      description: 'List of image sizes to download (e.g., ["full", "400"])'
      default:
        - full
      items:
        type: string
      originalType: 'string[]'
    variant_id:
      type: string
      description: The variant ID to process images for
      default: null
      originalType: string
  required:
    - variant_id
