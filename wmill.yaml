# $schema: https://raw.githubusercontent.com/windmill-labs/windmill/refs/heads/main/cli/wmill.schema.json
defaultTs: bun
includes:
  - f/**
excludes: []
codebases: []
skipVariables: false
skipResources: false
skipResourceTypes: false
skipSecrets: true
skipScripts: false
skipFlows: false
skipApps: false
skipFolders: false
includeSchedules: false
includeTriggers: false
includeUsers: false
includeGroups: true
includeSettings: false
includeKey: false
skipWorkspaceDependencies: false
locksRequired: true
lint: true
workspaces:
  commonSpecificItems:
    variables:
      - f/*_config/**
    resources:
      - f/*_config/**
    triggers:
      - f/triggers/**
  main:
    baseUrl: https://databot.dev.sageleaf.app
    workspaceId: sage-prod
  dev:
    baseUrl: https://databot.dev.sageleaf.app
    workspaceId: sage-dev
  localdev:
    baseUrl: https://localhost:8400
    workspaceId: localdev
    overrides:
      skipVariables: true
      skipResources: true
